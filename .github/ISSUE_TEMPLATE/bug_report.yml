name: "🐛 Bug Report"
description: "Report a reproducible bug, layout issue, or state glitch in RexOne Web."
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Before reporting, please verify the bug has not already been reported and that you have tested against the latest `main` or `dev` branch.
  - type: dropdown
    id: browser_environment
    attributes:
      label: "Browser & Environment"
      description: "Which browser and platform are you using?"
      options:
        - "Chrome / Chromium (macOS / Linux / Windows)"
        - "Firefox (macOS / Linux / Windows)"
        - "Safari / WebKit (macOS)"
        - "Mobile Safari (iOS / iPadOS)"
        - "Chrome for Android"
        - "Other / Headless (CI)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of the issue."
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Open the application at `http://localhost:4000`
        2. Navigate to `...`
        3. Click on `...`
        4. Observe unexpected behavior
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen instead?"
    validations:
      required: true
  - type: textarea
    id: logs_or_console
    attributes:
      label: "Browser Console & Network Logs"
      description: "Paste relevant browser console errors or network request details (mask any private tokens!)."
      render: shell
  - type: checkboxes
    id: preflight_checks
    attributes:
      label: "Preflight Verification"
      options:
        - label: "I have verified that no sensitive credentials, API keys, or private `.env` tokens are included in this report."
          required: true
        - label: "I have tested this against the latest branch and verified console warnings/errors."
          required: false
