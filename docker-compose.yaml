# rexone-web/docker-compose.yaml
# Production Docker Compose for Coolify

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  web:
    container_name: ${WEB_CONTAINER_NAME:-prod-rexone-web}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_REACT_APP_NAME: ${VITE_REACT_APP_NAME:-rexone.com}
        VITE_REACT_APP_GOOGLE_CLIENT_ID: ${VITE_REACT_APP_GOOGLE_CLIENT_ID:-}
        VITE_REACT_APP_GOOGLE_CLIENT_SECRET: ${VITE_REACT_APP_GOOGLE_CLIENT_SECRET:-}
        VITE_REACT_APP_SERVER_BASE_URL: ${VITE_REACT_APP_SERVER_BASE_URL:-https://api.rexone.com}
        VITE_REACT_APP_CLIENT_BASE_URL: ${VITE_REACT_APP_CLIENT_BASE_URL:-https://rexone.com}
        VITE_REACT_APP_SERVER_WS_BASE_URL: ${VITE_REACT_APP_SERVER_WS_BASE_URL:-wss://api.rexone.com}
        VITE_MEDIA_MAX_NON_VIDEO_SIZE_MB: ${VITE_MEDIA_MAX_NON_VIDEO_SIZE_MB:-10}
        VITE_MEDIA_MAX_VIDEO_SIZE_MB: ${VITE_MEDIA_MAX_VIDEO_SIZE_MB:-300}
        VITE_MEDIA_MAX_FILE_COUNT: ${VITE_MEDIA_MAX_FILE_COUNT:-30}
    restart: unless-stopped
    ports:
      - "${WEB_PORT_MAP:-80:80}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
    logging: *default-logging
    networks:
      - rexone-network

networks:
  rexone-network:
    name: ${DOCKER_NETWORK:-prod-rexone-net}
    external: true
