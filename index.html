<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Set theme immediately -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          const theme = savedTheme ? JSON.parse(savedTheme) : 'day';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'day');
        }
      })();
    </script>
    <!-- Favicon & Theme -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#160b11" />
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <!-- Primary Meta Tags -->
    <title>AtomicOS</title>
    <meta name="title" content="AtomicOS" />
    <meta name="description" content="AtomicOS — a modern AI-powered workspace platform." />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AtomicOS" />
    <meta property="og:title" content="AtomicOS" />
    <meta property="og:description" content="AtomicOS — a modern AI-powered workspace platform." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AtomicOS" />
    <meta name="twitter:description" content="AtomicOS — a modern AI-powered workspace platform." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
