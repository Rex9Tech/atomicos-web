<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Glass Gradient -->
    <radialGradient id="glassBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#24101A" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#160810" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0E040A" stop-opacity="1" />
    </radialGradient>

    <!-- Border Glow -->
    <linearGradient id="neonBorder" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2238" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#CC1125" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF4D2E" stop-opacity="0.65" />
    </linearGradient>

    <!-- Deep Ambient Glow Filter -->
    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>

    <!-- Neon Tube Core Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glassmorphic Crest -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#glassBg)" />
  <rect x="4.5" y="4.5" width="91" height="91" rx="25.5" stroke="url(#neonBorder)" stroke-width="1.5" />

  <!-- Subtle Ambient Radial Glow -->
  <circle cx="50" cy="50" r="30" fill="#FF2238" opacity="0.22" filter="url(#ambientGlow)" />

  <!-- Outer Neon Halo Layer -->
  <g stroke="#CC1125" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" stroke-width="9.5" filter="url(#ambientGlow)">
    <path d="M 19 65 C 19 63 17 62 16 63.5 C 15 65 16 67 18 67.5 C 20.5 68 22.5 66 22.5 63.5 C 22.5 59.5 18 57.5 14 59 C 10 61 9.5 67 11.5 70.5 C 14 74 21 74.5 25.5 72.5 C 27.5 71.5 28 69.5 28 67 V 28 C 28 24 38 22 47 27 C 53 30 51 40 43 44 C 36 47 33 49 33 50" />
    <path d="M 33 50 C 37 50 43 62 48 70 C 52 76 57 74 61 62 C 64 50 66 36 68 28 V 68 C 68 71 65 73 60 72 C 58 72 58 70 60 69 C 62 68 65 72 78 72" />
  </g>

  <!-- Middle Vibrant Neon Tube Layer -->
  <g stroke="#FF2238" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.8" filter="url(#neonGlow)">
    <path d="M 19 65 C 19 63 17 62 16 63.5 C 15 65 16 67 18 67.5 C 20.5 68 22.5 66 22.5 63.5 C 22.5 59.5 18 57.5 14 59 C 10 61 9.5 67 11.5 70.5 C 14 74 21 74.5 25.5 72.5 C 27.5 71.5 28 69.5 28 67 V 28 C 28 24 38 22 47 27 C 53 30 51 40 43 44 C 36 47 33 49 33 50" />
    <path d="M 33 50 C 37 50 43 62 48 70 C 52 76 57 74 61 62 C 64 50 66 36 68 28 V 68 C 68 71 65 73 60 72 C 58 72 58 70 60 69 C 62 68 65 72 78 72" />
  </g>

  <!-- Core Hot-White Neon Filament -->
  <g stroke="#FFF2F4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
    <path d="M 19 65 C 19 63 17 62 16 63.5 C 15 65 16 67 18 67.5 C 20.5 68 22.5 66 22.5 63.5 C 22.5 59.5 18 57.5 14 59 C 10 61 9.5 67 11.5 70.5 C 14 74 21 74.5 25.5 72.5 C 27.5 71.5 28 69.5 28 67 V 28 C 28 24 38 22 47 27 C 53 30 51 40 43 44 C 36 47 33 49 33 50" />
    <path d="M 33 50 C 37 50 43 62 48 70 C 52 76 57 74 61 62 C 64 50 66 36 68 28 V 68 C 68 71 65 73 60 72 C 58 72 58 70 60 69 C 62 68 65 72 78 72" />
  </g>
</svg>
